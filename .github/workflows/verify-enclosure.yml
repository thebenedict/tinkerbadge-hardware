name: Prepare Mac CAD verification environment
on:
  push:
    branches: [pcb-04-enclosure-build]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Resolve the pinned packages for the local KiCad fit check
        run: |
          python -m pip download --only-binary=:all: -r mechanical/enclosure/requirements.txt -d wheels
          cd wheels
          shasum -a 256 *.whl > SHA256SUMS
          rm -f cadquery_ocp-7.8.1.1.post1-cp312-cp312-macosx_11_0_arm64.whl vtk-9.3.1-cp312-cp312-macosx_11_0_arm64.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-cad-wheels
          path: wheels/
          compression-level: 0
          retention-days: 1
