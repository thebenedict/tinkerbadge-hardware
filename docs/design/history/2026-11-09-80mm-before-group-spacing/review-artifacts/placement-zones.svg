<text x="42" y="625" text-anchor="start" font-size="18" font-weight="bold" fill="#1d3045">What changed</text>
<text x="42" y="651" text-anchor="start" font-size="15" font-weight="normal" fill="#1d3045">164 non-test electrical footprints are front-side. Rear retains six bare test pads and mechanical allowances.</text>
<text x="42" y="677" text-anchor="start" font-size="15" font-weight="normal" fill="#1d3045">Affinity LEDs span the full bottom at 23.5 mm pitch. Both buttons stay on the left; USB and Qwiic face right.</text>
<text x="42" y="703" text-anchor="start" font-size="15" font-weight="normal" fill="#9a431d">The top notch removes FR4 under the radio antenna. Glass remains only 3.5 mm behind the antenna.</text>
<text x="42" y="729" text-anchor="start" font-size="15" font-weight="normal" fill="#9a431d">NFC area is only 18 × 13 mm. Its coil, display flex, exact part heights and enclosure remain unqualified.</text>
<text x="42" y="782" text-anchor="start" font-size="14" font-weight="normal" fill="#546274">Functional diagram only. Dashed shapes and “?” labels are unresolved review envelopes, not approved parts.</text>
